  <body>
    <div id="root"></div>
    <script>
      // Restore the original client-side route after GitHub Pages sends a
      // missing path through 404.html.
      ;(function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (part) {
              return part.replace(/~and~/g, '&')
            })
            .join('?')

          window.history.replaceState(
            null,
            '',
            location.pathname.slice(0, -1) + decoded + location.hash,
          )
        }
      })(window.location)
    </script>
    <script type="module" src="/src/main.jsx"></script>
