<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VETS4VETS26</title>
    <script>
      // GitHub Pages has no native SPA fallback. Preserve the requested route
      // in the query string, return to the site root, and let index.html
      // restore the clean URL before React starts.
      // redirect to the same route on the root of the repository, preserving query string and hash
      ;(function (location) {
        var pathSegmentsToKeep = 0
        var repositoryRoot = location.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/')
        var route = location.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~')
        var query = location.search
          ? '&' + location.search.slice(1).replace(/&/g, '~and~')
          : ''

        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            repositoryRoot +
            '/?/' +
            route +
            query +
            location.hash,
        )
      })(window.location)
    </script>
  </head>
  <body>
    <p>Redirecting to VETS4VETS26…</p>
  </body>
</html>
